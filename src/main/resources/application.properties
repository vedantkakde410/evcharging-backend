# ========== Server ==========
# PORT is set automatically by most hosts (e.g. Railway) - falls back to
# 8801 for local dev where nothing sets it.
server.port=${PORT:8801}

# ========== Database (MySQL) ==========
# No hardcoded credentials (Module P0) - DB_PASSWORD has no default on
# purpose, unlike the other env vars in this file. For local development,
# export DB_PASSWORD (and DB_URL/DB_USERNAME if they differ from the
# defaults below) as a real shell/IDE-run-configuration environment
# variable before running - see .env.example and DEPLOYMENT.md.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ev_charging_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ========== JPA / Hibernate ==========
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========== JWT ==========
# Override via the JWT_SECRET environment variable in any real deployment.
# The fallback below is dev-only, checked into source control on purpose so
# `mvn spring-boot:run` works out of the box locally - it must never be relied
# on outside a developer's machine.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-via-JWT_SECRET-env-var-before-any-shared-deployment-0123456789}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:86400000}
app.jwt.reset-token-expiry-ms=${JWT_RESET_EXPIRY_MS:600000}

# ========== Mail (OTP delivery) ==========
# Defaults target MailHog (https://github.com/mailhog/MailHog) running
# locally with `mailhog` on its default SMTP port 1025 - mail sent here is
# caught and viewable at http://localhost:8025, nothing is actually
# delivered. Point MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD at a real
# SMTP provider (e.g. Gmail with an App Password, SendGrid, Mailgun) via
# environment variables to deliver real emails.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@evcharge.local}

# ========== CORS ==========
# Comma-separated list of allowed origins (e.g. the deployed frontend URL),
# read by EvchargingApplication.corsConfigurer(). Defaults to "*" to match
# this app's existing dev behavior (IMPROVEMENT_REPORT.md #20 already
# flagged the wildcard as a known, pre-existing looseness) - set explicitly
# to the real frontend origin(s) in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}